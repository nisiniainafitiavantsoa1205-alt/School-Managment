# Configuration de la base de données embarquée H2 (PRISMA School)
# L'application est 100% autonome et ne nécessite aucune installation de serveur.

hibernate.connection.driver_class=org.h2.Driver
hibernate.connection.url=jdbc:h2:./data/prisma_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=TRUE
hibernate.connection.username=sa
hibernate.connection.password=
hibernate.dialect=org.hibernate.dialect.H2Dialect

